# ============================================================
# JEFES LEGENDARIOS DE ELDENCRAFT
# ============================================================
# Cada jefe se basa en una entidad vanilla pero con stats brutales,
# nombre personalizado, brillo y loot custom.
#
# Campos:
#   entity      -> EntityType valido (RAVAGER, WARDEN, BREEZE, BOGGED...)
#   display     -> Nombre visible (acepta &#colores)
#   max-health  -> Vida maxima (en puntos, 1 corazon = 2)
#   damage      -> Da#o base de melee (atributo GENERIC_ATTACK_DAMAGE)
#   armor       -> Armadura (atributo GENERIC_ARMOR, 0..30)
#   speed       -> Multiplicador de velocidad (1.0 = normal)
#   glowing     -> Si brilla a traves de paredes
#   exp-reward  -> EXP del MMO al matarlo
#   gold-reward -> Oro al matarlo
#   loot        -> Items que dropea (lista MATERIAL:cantidad)
#   announce    -> Mensaje al broadcast cuando aparece
# ============================================================

bosses:

  skarn:
    entity: STRAY
    display: "&b&l☃ Skarn, el Devastador del Hielo"
    max-health: 400
    damage: 12
    armor: 12
    speed: 1.1
    glowing: true
    exp-reward: 1500
    gold-reward: 500
