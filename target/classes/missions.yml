# =====================================================
#   EldenCraft - 50 Misiones
# =====================================================
# Tipos de mision soportados:
#   KILL    -> matar X mobs de cierto tipo
#   GATHER  -> recoger X bloques/items (al picar/recoger)
#   FISH    -> pescar X veces
#   BREED   -> criar X animales
#   TRAVEL  -> caminar X bloques
#   CRAFT   -> craftear X items
#
# target = nombre EXACTO en MAYUSCULAS de Material o EntityType
#          (segun el tipo de mision).
# Para misiones tipo KILL puedes usar "ANY_HOSTILE" para cualquier mob hostil.
# Las misiones se entregan automaticamente al subir de nivel y al
# completarse dan EXP y oro. Las recompensas son MUCHO mejores que matar mobs.

