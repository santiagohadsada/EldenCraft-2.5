# =====================================================
#   EldenCraft - Tienda por clase
# =====================================================
# Cada clase tiene una lista de items.
# Formato:
#   - material: DIAMOND_SWORD       # Material vanilla o id de plugin externo
#     name: "&6Espada del Heroe"    # Nombre visible
#     price: 500                    # Precio en oro
#     lore:                         # Descripcion (opcional)
#       - "&7Una espada legendaria"
#
# Los items quedan vacios a proposito: tu los rellenas
# con tu plugin de ItemEdit / MMOItems / etc.
#
# IMPORTANTE: Para usar un item de otro plugin, simplemente
# pon su material como referencia (DIAMOND_SWORD por ejemplo)
# y luego usa /itemedit u otro plugin para personalizarlo
# despues de comprarlo. O extiende el codigo de ShopManager
# para integrar tu plugin externo.

